apiVersion: batch/v1
kind: Job
metadata:
  name: wallet-perf
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: wallet-perf
          image: wallet-perf:latest
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "1"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "1Gi"
          args:
            - "--scenario"
            - "mixed"
            - "--workers"
            - "1"
            - "--duration-secs"
            - "30"
            - "--warmup-secs"
            - "5"
            - "--users"
            - "200"
            - "--prefund-minor"
            - "1000000"
