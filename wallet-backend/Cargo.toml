[workspace]
resolver = "2"
members = [
  "crates/wallet-domain",
  "crates/wallet-app",
  "crates/wallet-infra",
  "crates/wallet-api",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

tower-http = { version = "0.6", features = ["cors"] }

sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-rustls", "migrate"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0.18"
uuid = { version = "1.20.0", features = ["v4"] }
anyhow = "1.0.100"

# MVP auth (RBAC gate)
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"

# OpenAPI / Swagger UI
utoipa = { version = "5.4", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9.0", features = ["axum", "vendored"] }
# Test utilities
bytes = "1"
http-body-util = "0.1"
proptest = "1"
tempfile = "3"
tower = "0.5"
