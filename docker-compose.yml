services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      ADMIN_TOKEN: "${ADMIN_TOKEN:-admin-dev-token}"
      USER_TOKEN_SECRET: "${USER_TOKEN_SECRET:-dev-secret}"
      BIND_ADDR: "${BIND_ADDR:-0.0.0.0:3000}"
      DB_FILE: "${DB_FILE:-/data/wallet.db}"
      RUST_LOG: "${RUST_LOG:-info}"
    ports:
      - "3000:3000"
    volumes:
      - ./wallet-backend:/repo/wallet-backend
      - cargo-cache:/usr/local/cargo/registry
      - target-cache:/repo/wallet-backend/target
      - api-data:/data

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "5173:5173"
    environment:
      # keep empty for dev proxy; override if you want direct calls
      VITE_API_BASE: "${VITE_API_BASE:-}"
    volumes:
      - ./wallet-web:/repo/wallet-web
      - node-modules:/repo/wallet-web/node_modules
    depends_on:
      - api

volumes:
  cargo-cache: {}
  target-cache: {}
  node-modules: {}
  api-data: {}
